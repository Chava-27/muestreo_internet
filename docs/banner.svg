<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#091926" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Fondo base y cuadrícula -->
  <rect width="1200" height="300" rx="12" fill="url(#bg-grad)" />
  <rect width="1200" height="300" rx="12" fill="url(#grid)" />

  <!-- Borde sutil -->
  <rect x="2" y="2" width="1196" height="296" rx="10" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Ondas decorativas de telemetría / red a la derecha -->
  <g opacity="0.25" stroke="url(#accent-grad)" fill="none" stroke-width="2.5">
    <path d="M 750 220 Q 830 120, 910 180 T 1070 110 T 1200 150" />
    <path d="M 750 245 Q 850 160, 940 205 T 1100 140 T 1200 180" stroke-opacity="0.6" />
    <circle cx="910" cy="180" r="5" fill="#00d2ff" />
    <circle cx="1070" cy="110" r="5" fill="#00d2ff" />
  </g>

  <!-- Ícono central izquierdo (Radar / Conectividad) -->
  <g transform="translate(95, 150)">
    <circle cx="0" cy="0" r="52" fill="#00d2ff" fill-opacity="0.08" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="8 6" />
    <!-- Barras de velocidad -->
    <rect x="-18" y="4" width="7" height="16" rx="2" fill="#3a7bd5" />
    <rect x="-7" y="-6" width="7" height="26" rx="2" fill="#00a8ff" />
    <rect x="4" y="-16" width="7" height="36" rx="2" fill="#00d2ff" />
    <rect x="15" y="-24" width="7" height="44" rx="2" fill="#5ce1e6" />
  </g>

  <!-- Título Principal -->
  <text x="180" y="138" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="1">
    MuestreoInternet
  </text>

  <!-- Línea de acento -->
  <rect x="180" y="154" width="110" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Subtítulo -->
  <text x="180" y="192" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8b949e">
    Motor de telemetría de red y generación automatizada de datasets CSV
  </text>

  <!-- Etiqueta inferior derecha -->
  <text x="1160" y="272" text-anchor="end" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#58a6ff" opacity="0.8">
    // INTERVALO: 10s • MODO DUAL (AUTO / MANUAL)
  </text>
</svg>