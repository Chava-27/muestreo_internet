<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="MuestreoInternet v3.0 — monitoreo continuo de red con exportación a CSV">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rejilla" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="marco"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1200" height="320" fill="url(#fondo)"/>
    <rect x="640" width="560" height="320" fill="url(#rejilla)"/>

    <!-- Gráfica de latencia: línea base estable con un pico y una caída -->
    <g transform="translate(640 40)">
      <line x1="40" y1="200" x2="520" y2="200" stroke="#ffffff" stroke-opacity="0.12"/>
      <line x1="40" y1="110" x2="520" y2="110" stroke="#f59e0b" stroke-opacity="0.35" stroke-dasharray="4 6"/>
      <text x="520" y="102" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#f59e0b" fill-opacity="0.8">umbral 150 ms</text>

      <path d="M40 170 L80 166 L120 172 L160 164 L200 168 L240 150 L270 92 L300 158 L340 166 L380 162 L410 166 L430 200 L450 200 L470 168 L520 164 L520 200 L40 200 Z" fill="url(#area)"/>
      <path d="M40 170 L80 166 L120 172 L160 164 L200 168 L240 150 L270 92 L300 158 L340 166 L380 162 L410 166 L430 200 L450 200 L470 168 L520 164" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linejoin="round"/>

      <circle cx="270" cy="92" r="5" fill="#f59e0b"/>
      <circle cx="440" cy="200" r="5" fill="#f43f5e"/>
      <text x="270" y="78" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#f59e0b">Inestable</text>
      <text x="440" y="222" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#f43f5e">Caída</text>
      <circle cx="520" cy="164" r="5" fill="#2dd4bf"/>
      <circle cx="520" cy="164" r="11" fill="none" stroke="#2dd4bf" stroke-opacity="0.4"/>
    </g>

    <!-- Texto principal -->
    <g font-family="'Segoe UI', 'Inter', system-ui, sans-serif">
      <text x="64" y="74" font-family="Consolas, 'Cascadia Mono', monospace" font-size="13" letter-spacing="2" fill="#2dd4bf">v3.0 · PYTHON · WINDOWS</text>
      <text x="62" y="128" font-size="52" font-weight="700" fill="#f1f5f9">MuestreoInternet</text>
      <text x="64" y="164" font-size="19" fill="#94a3b8">Monitoreo continuo de red con exportación a CSV</text>
    </g>

    <!-- Métricas capturadas -->
    <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="13" fill="#cbd5e1">
      <g transform="translate(64 204)">
        <rect width="118" height="30" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="59" y="20" text-anchor="middle">↓ ↑ Mbps</text>
      </g>
      <g transform="translate(192 204)">
        <rect width="118" height="30" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="59" y="20" text-anchor="middle">ping · jitter</text>
      </g>
      <g transform="translate(320 204)">
        <rect width="118" height="30" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="59" y="20" text-anchor="middle">pérdida %</text>
      </g>
      <g transform="translate(448 204)">
        <rect width="118" height="30" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="59" y="20" text-anchor="middle">router · DNS</text>
      </g>
      <g transform="translate(64 244)">
        <rect width="118" height="30" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="59" y="20" text-anchor="middle">señal Wi-Fi</text>
      </g>
      <g transform="translate(192 244)">
        <rect width="118" height="30" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="59" y="20" text-anchor="middle">IP · puerto</text>
      </g>
      <g transform="translate(320 244)">
        <rect width="246" height="30" rx="6" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-opacity="0.45"/>
        <text x="123" y="20" text-anchor="middle" fill="#2dd4bf">50 columnas por muestra</text>
      </g>
    </g>

    <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  </g>
</svg>
